<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veri Bilimi Quiz</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="confetti-wrap" id="confetti" aria-hidden="true"></div>

    <div class="container">
      <div id="start-screen" class="screen">
        <div class="logo-badge">Veri Bilimi Topluluğu</div>
        <h1>DATA<br />QUIZ</h1>


        <div class="info-grid">
          <div class="info-card">
            <span class="num" id="info-question-count">3</span>
            <span class="label">Soru</span>
          </div>
          <div class="info-card">
            <span class="num">🎁</span>
            <span class="label">Ödül</span>
          </div>
          <div class="info-card">
            <span class="num">∞</span>
            <span class="label">Deneme</span>
          </div>
        </div>

        <div class="difficulty-row">
          <span class="diff-pill easy">● Kolay</span>
          <span class="diff-pill medium">● Orta</span>
          <span class="diff-pill hard">● Zor</span>
        </div>

        <button type="button" class="start-btn" id="start-btn">BAŞLA →</button>
      </div>

      <div id="quiz-screen" class="screen">
        <div class="progress-header">
          <div class="q-counter">
            Soru <span id="q-num">1</span>/<span id="q-total">3</span>
          </div>
          <div class="diff-indicator" id="diff-badge"></div>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
        </div>

        <div class="question-card">
          <div class="q-number" id="q-label"></div>
          <div class="question-text" id="question-text"></div>
        </div>

        <div class="options-grid" id="options-grid"></div>
        <div class="feedback-box" id="feedback-box"></div>
        <button type="button" class="next-btn" id="next-btn">DEVAM ET →</button>
      </div>

      <div id="result-screen" class="screen">
        <div class="result-icon" id="result-icon"></div>
        <div class="result-title" id="result-title"></div>
        <p class="result-sub" id="result-sub"></p>

        <div class="score-display">
          <div class="score-box">
            <span class="big green" id="correct-count">0</span>
            <span class="small">Doğru</span>
          </div>
          <div class="score-box">
            <span class="big red" id="wrong-count">0</span>
            <span class="small">Yanlış</span>
          </div>
        </div>

        <div id="coupon-section"></div>
        <button type="button" class="retry-btn" id="retry-btn">↩ Tekrar Dene</button>
      </div>
    </div>

    <script src="js/questions.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
